# Keeps the Streamlit Community Cloud deployment awake.
#
# Community Cloud puts an app to sleep after a period without visitors, and a plain
# HTTP request does not count as a visit. This job opens the app in headless Chromium
# every 6 hours, presses the wake-up button if the app is asleep, and waits until the
# app has rendered.
#
# Setup: Repository → Settings → Secrets and variables → Actions → Variables →
#        New repository variable  APP_URL = https://<your-app>.streamlit.app
#
# Note: GitHub pauses scheduled workflows in repositories with no activity for 60 days;
#       re-enable it from the Actions tab (or push a commit) if that happens.
name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours (UTC), off the top of the hour to avoid the busiest slot
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Check that APP_URL is configured
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Repository variable APP_URL is not set (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and headless Chromium
        run: |
          npm init -y > /dev/null
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Visit the app
        run: |
          cat > visit.cjs <<'SCRIPT'
          const { chromium } = require('playwright');

          const url = process.env.APP_URL;
          const APP = '[data-testid="stAppViewContainer"]';
          const WAKE = /get this app back up/i;

          // Community Cloud serves the app inside a frame, so look in every frame.
          async function inAnyFrame(page, fn) {
            for (const frame of page.frames()) {
              try { if (await fn(frame)) return true; } catch (_) { /* frame navigated; try the next one */ }
            }
            return false;
          }

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            console.log(`Opening ${url}`);
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });

            const deadline = Date.now() + 8 * 60 * 1000;
            let woke = false, up = false;
            while (Date.now() < deadline) {
              if (await inAnyFrame(page, async f => (await f.locator(APP).count()) > 0)) { up = true; break; }
              const asleep = await inAnyFrame(page, async f => {
                const button = f.getByRole('button', { name: WAKE });
                if (await button.count()) { await button.first().click(); return true; }
                return false;
              });
              if (asleep && !woke) { woke = true; console.log('App was asleep; wake-up requested.'); }
              await page.waitForTimeout(5000);
            }
            if (!up) { console.error('The app did not finish loading in time.'); await browser.close(); process.exit(1); }

            await page.waitForTimeout(20000);      // hold the session long enough to register as a visit
            console.log(woke ? 'App woken and rendered.' : 'App is awake and rendered.');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          SCRIPT
          node visit.cjs
